@layer base{a{color:inherit;text-decoration:none}}
/* RouteLog additions (not in the original compiled Tailwind) */
.rl-input{width:100%;border:1px solid var(--input);background:transparent;padding:0 .75rem;font-size:.95rem;outline:none;color:var(--foreground)}
.rl-input:focus{box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 35%,transparent);border-color:var(--ring)}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.rl-toast{background:#fff;color:var(--foreground);border:1px solid var(--border);box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:10px;padding:10px 16px;font-size:13px;font-weight:500;transition:opacity .3s;max-width:90vw}
.rl-toast-error{border-color:#fca5a5;color:#b91c1c}
.rl-toast-success{border-left:4px solid #16a34a}
.rl-sheet{animation:rl-up .2s ease-out}
@keyframes rl-up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

async function fetchAll(table, filter, order) {
  const out = []; const page = 1000;
  for (let from = 0; ; from += page) {
    let q = sb.from(table).select("*");
    for (const [k, v] of Object.entries(filter)) q = q.eq(k, v);
    for (const o of order) q = q.order(o);
    const { data, error } = await q.range(from, from + page - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < page) break;
  }
  return out;
}

/* ---------- Field Testing (live log — fix as we go) ---------- */
function fieldStats(ev) {
  const voice = ev.filter(e => e.outcome !== "box");
  const r = { totalSearches: ev.length, voiceSearches: voice.length, firstTime: 0, corrected: 0, noMatch: 0, list: 0, parcels: 0,
    successfulFirstTimeMatches: 0, searchesRequiringManualCorrection: 0, newLearnedMappingsCreated: 0, averageResponseTimeMs: 0,
    learnedMappingsUsedCount: 0, fuzzyMatchingUsedCount: 0, commonSpeechErrors: new Map() };
  let t = 0, tn = 0;
  ev.forEach(o => {
    const legacy = !o.outcome;   // rows from before every search was logged
    if (o.outcome === "parcel") r.parcels++;
    if (o.manual_correction_made) { r.corrected++; r.searchesRequiringManualCorrection++; r.newLearnedMappingsCreated++; }
    else if (o.outcome === "found" || o.outcome === "parcel" || o.outcome === "box") r.firstTime++;
    if (o.outcome === "no-match" && !o.manual_correction_made) r.noMatch++;
    if (o.outcome === "list" && !o.manual_correction_made) r.list++;
    if (o.learned_mapping_used) r.learnedMappingsUsedCount++;
    if (o.fuzzy_matching_used) r.fuzzyMatchingUsedCount++;
    if (o.response_time_ms != null) { t += o.response_time_ms; tn++; }
    if ((o.manual_correction_made || o.outcome === "no-match") && o.normalized_transcript) r.commonSpeechErrors.set(o.normalized_transcript, (r.commonSpeechErrors.get(o.normalized_transcript) || 0) + 1);
    if (legacy && !o.manual_correction_made) r.firstTime++;
  });
  r.successfulFirstTimeMatches = r.firstTime;
  r.averageResponseTimeMs = tn ? Math.round(t / tn) : 0;
  return r;
}
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
let fieldTimer = null;
async function tabField(body) {
  clearInterval(fieldTimer);
  const hours = +lsGet("rl-ft-hours", "24"), onlyIssues = lsGet("rl-ft-issues", "false") === "true";
  body.innerHTML = heading("Field Testing — live", "Every voice search on the route, as it happens. Spot what it gets wrong and fix it on the spot. Updates every 20 seconds.") + routeSelect() +
    `<div class="flex flex-wrap gap-2 mb-4 items-center">${[[24, "Last 24 hours"], [168, "Last 7 days"], [0, "All time"]].map(([h, l]) => `<button data-h="${h}" class="${h === hours ? btnPrimary : btnOutline}">${l}</button>`).join("")}
      <label class="ml-2 flex items-center gap-2 text-sm"><input type="checkbox" data-issues ${onlyIssues ? "checked" : ""}> Only show problems</label></div><div data-inner></div>`;
  bindRouteSelect(() => tabField(body));
  $$("[data-h]").forEach(b => (b.onclick = () => { lsSet("rl-ft-hours", b.dataset.h); tabField(body); }));
  $("[data-issues]").onchange = e => { lsSet("rl-ft-issues", String(e.target.checked)); tabField(body); };
  const inner = $("[data-inner]");
  if (!A.routeSel) return (inner.innerHTML = `<div class="p-6 bg-muted rounded-lg text-center text-muted-foreground">Select a route above to see its voice searches.</div>`);
  inner.innerHTML = `<div class="${card} text-center text-muted-foreground">Loading…</div>`;
  let stopsById = new Map();
  try { stopsById = new Map((await fetchAll("stops", { route_id: A.routeSel }, ["id"])).map(x => [x.id, x])); } catch {}
  const load = async () => {
    let q = sb.from("search_events").select("*").eq("route_id", A.routeSel).order("created_at", { ascending: false }).limit(2000);
    if (hours) q = q.gte("created_at", new Date(Date.now() - hours * 3600e3).toISOString());
    const { data: ev = [], error } = await q;
    if (error) return (inner.innerHTML = `<div class="${card} text-destructive">${esc(error.message)}</div>`);
    draw(ev || []);
  };
  const badge = o => o.manual_correction_made ? `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-orange-100 text-orange-700">Corrected</span>`
    : o.outcome === "found" ? `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-emerald-100 text-emerald-800">Found ✓</span>`
    : o.outcome === "parcel" ? `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-yellow-100 text-yellow-800">Parcel ✓</span>`
    : o.outcome === "box" ? `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-sky-100 text-sky-700">Box</span>`
    : o.outcome === "list" ? `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-slate-100 text-slate-600">Showed list</span>`
    : o.outcome === "no-match" ? `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-red-100 text-red-700">No match</span>`
    : `<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-orange-100 text-orange-700">Corrected</span>`;
  const isIssue = o => !o.fixed && (o.manual_correction_made || o.outcome === "no-match" || o.outcome === "list");
  function draw(all) {
    const g = fieldStats(all), ev = onlyIssues ? all.filter(isIssue) : all, v = g.voiceSearches - 0;
    const tile = (l, val, sub) => `<div class="p-4 bg-card rounded-lg border border-border"><div class="text-sm text-muted-foreground">${l}</div><div class="text-3xl font-bold text-foreground mt-2">${val}</div>${sub ? `<div class="text-xs text-muted-foreground mt-1">${sub}</div>` : ""}</div>`;
    inner.innerHTML = !all.length ? `<div class="${card} text-center text-muted-foreground">No voice searches logged yet. Use the mic in the app — every search appears here within 20 seconds.</div>` : `
      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4 mb-6">
        ${tile("Voice searches", g.totalSearches)}${tile("Right first time", pct(g.firstTime, g.totalSearches) + "%", `${g.firstTime} searches`)}
        ${tile("Needed a tap", g.corrected, "postman picked the house")}${tile("No match", g.noMatch, "nothing found")}
        ${tile("Parcels by voice", g.parcels)}${tile("Avg reply", g.averageResponseTimeMs ? (g.averageResponseTimeMs / 1000).toFixed(1) + "s" : "—")}
      </div>
      <div class="${card} overflow-x-auto mb-6"><table class="w-full text-sm"><thead><tr class="text-left text-muted-foreground border-b border-border">
        <th class="py-2 pr-3">When</th><th class="py-2 pr-3">Heard</th><th class="py-2 pr-3">App said</th><th class="py-2 pr-3">Result</th><th class="py-2 pr-3">Right house</th><th class="py-2">Fix</th></tr></thead>
      <tbody>${ev.slice(0, 300).map(o => {
        const st = o.selected_stop_id ? stopsById.get(o.selected_stop_id) : null;
        const canAlias = st && (o.manual_correction_made) && !o.fixed && o.original_transcript;
        return `<tr class="border-b border-border ${isIssue(o) ? "bg-orange-50/50" : ""}" data-eid="${o.id}">
          <td class="py-2 pr-3 whitespace-nowrap text-xs text-muted-foreground">${new Date(o.created_at).toLocaleTimeString("en-IE", { hour: "2-digit", minute: "2-digit" })}<br>${new Date(o.created_at).toLocaleDateString("en-IE", { day: "numeric", month: "short" })} · ${esc(o.app_mode || "")}${o.by_relief ? " · relief" : ""}</td>
          <td class="py-2 pr-3 font-semibold">“${esc(o.original_transcript || "")}”</td>
          <td class="py-2 pr-3 text-muted-foreground">${esc(o.spoken || "")}</td>
          <td class="py-2 pr-3">${badge(o)}${o.learned_mapping_used ? ` <span class="text-xs text-muted-foreground">learned</span>` : ""}</td>
          <td class="py-2 pr-3">${st ? `${esc(st.business_name || splitPipe(st.residents)[0] || "")}<div class="text-xs text-muted-foreground">#${st.stop_order}</div>` : esc(o.selected_stop_name || "—")}</td>
          <td class="py-2 whitespace-nowrap">${o.fixed ? `<span class="text-xs text-emerald-700 font-semibold">Fixed ✓</span>` : `
            ${canAlias ? `<button data-alias="${o.id}" class="${btnOutline} !py-1 text-xs" title="Adds what the phone heard to this house's aliases, so it's found next time">+ Add as alias</button>` : ""}
            ${isIssue(o) ? `<button data-fix="${o.id}" class="${btnOutline} !py-1 text-xs">Mark fixed</button>` : ""}`}</td></tr>`;
      }).join("")}</tbody></table>${ev.length > 300 ? `<p class="text-xs text-muted-foreground mt-2">Showing latest 300 of ${ev.length}</p>` : ""}</div>
      <div class="flex gap-2"><button data-csv class="${btnOutline}">${icon("download", 16)}Export CSV</button><button data-clear class="${btnDanger}">${icon("trash", 16)}Clear log</button></div>`;
    $("[data-csv]", inner)?.addEventListener("click", () => downloadFile(`voice-searches-${A.routeSel}-${new Date().toISOString().slice(0, 10)}.csv`, toCSV([["Time", "Mode", "Relief", "Heard", "App said", "Result", "Corrected", "Right house", "Reply ms"],
      ...all.map(o => [o.created_at, o.app_mode, o.by_relief ? "yes" : "", o.original_transcript, o.spoken, o.outcome, o.manual_correction_made ? "yes" : "", o.selected_stop_name, o.response_time_ms])]), "text/csv"));
    $("[data-clear]", inner)?.addEventListener("click", async () => { if (!confirm("Clear the voice search log for this route?")) return; const { error } = await sb.from("search_events").delete().eq("route_id", A.routeSel); if (error) return toast.error(error.message); toast.success("Cleared"); load(); });
    inner.onclick = async e => {
      const al = e.target.closest("[data-alias]"), fx = e.target.closest("[data-fix]");
      if (!al && !fx) return;
      const o = all.find(x => x.id === +(al || fx).dataset[al ? "alias" : "fix"]);
      if (al) {
        const st = stopsById.get(o.selected_stop_id), heard = o.original_transcript.trim();
        const list = splitPipe(st.aliases); if (!list.some(x => x.toLowerCase() === heard.toLowerCase())) list.push(heard);
        const { error } = await sb.from("stops").update({ aliases: list.join(" | ") }).eq("id", st.id);
        if (error) return toast.error(error.message);
        st.aliases = list.join(" | ");
        await sb.rpc("record_correction", { p_route_id: A.routeSel, p_stop_id: st.id, p_original: heard, p_normalized: heard.toLowerCase().replace(/\s+/g, " "), p_tags: ["admin"] });
        toast.success(`“${heard}” added to ${st.business_name || splitPipe(st.residents)[0]}`);
      }
      await sb.from("search_events").update({ fixed: true }).eq("id", o.id);
      o.fixed = true; draw(all);
    };
  }
  await load();
  fieldTimer = setInterval(() => { if (A.tab === "field-testing" && document.visibilityState === "visible") load(); else clearInterval(fieldTimer); }, 20000);
}

/* ---------- Route Intelligence config ---------- */
function tabConfig(body) {
  body.innerHTML = heading("Route Intelligence Configuration", "Configure search engine behavior, thresholds, and feature flags — per route, applied the next time the app opens the route") + routeSelect() + `<div data-inner></div>`;
  bindRouteSelect(() => tabConfig(body));
  if (!A.routeSel) return;
  const r = A.routes.find(x => x.id === A.routeSel); let t = { ...RI_DEFAULTS, ...(r.settings || {}) };
  const inner = $("[data-inner]");
  const draw = () => {
    const chk = (k, l, d) => `<div class="${card}"><label class="flex items-center gap-3 cursor-pointer"><input type="checkbox" data-k="${k}" ${t[k] ? "checked" : ""} class="w-5 h-5 rounded border-border"><div><div class="font-semibold text-foreground">${l}</div><div class="text-sm text-muted-foreground">${d}</div></div></label></div>`;
    const rng = (k, l, d, min, max, step, fmt) => `<div><label class="block text-sm font-semibold text-foreground mb-2">${l}</label><div class="flex items-center gap-4"><input type="range" data-k="${k}" min="${min}" max="${max}" step="${step}" value="${t[k]}" class="flex-1"><span class="w-14 text-right font-semibold">${fmt(t[k])}</span></div><p class="text-xs text-muted-foreground mt-1">${d}</p></div>`;
    inner.innerHTML = `<div class="space-y-6">
      <div class="p-4 rounded-lg border ${t.enabled ? "bg-green-50 border-green-200" : "bg-red-50 border-red-200"}"><div class="flex items-center gap-2">${icon("brain", 20, t.enabled ? "text-green-600" : "text-red-600")}<div><div class="font-semibold text-foreground">Route Intelligence is ${t.enabled ? "Enabled" : "Disabled"}</div><div class="text-sm text-muted-foreground">${t.enabled ? "Voice search uses Route Intelligence with learned mappings" : "Voice search uses legacy fuzzy matching"}</div></div></div></div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">${chk("enabled", "Enable Route Intelligence", "Use advanced search engine for voice queries")}${chk("enableAliasMatching", "Enable Alias Matching", "Match against resident aliases and nicknames")}${chk("enableBroadFallback", "Enable Broad Fallback", "Single words can also match route ref, notes and tags")}</div>
      <div class="${card} space-y-6"><h3 class="font-semibold">Thresholds & Limits</h3>
        ${rng("fuzzyMatchingThreshold", "Fuzzy Matching Threshold", "Minimum similarity score for fuzzy matching results (0.65 = 65% match required)", 0.3, 1, 0.05, v => Math.round(v * 100) + "%")}
        ${rng("learnedMappingConfidenceThreshold", "Learned Mapping Confidence Threshold", "Minimum confidence to use learned mappings (0.5 = one confirmation is enough)", 0.5, 0.85, 0.05, v => Math.round(v * 100) + "%")}
        ${rng("maxFuzzyResults", "Maximum Fuzzy Results", "Caps how many loose matches the engine considers (1-20)", 1, 20, 1, v => v)}</div>
      <div class="flex gap-2"><button data-save class="${btnPrimary}">${icon("save", 16)}Save configuration</button><button data-reset class="${btnOutline}">Reset to Defaults</button></div>
      <p class="text-sm text-muted-foreground"><strong>Note:</strong> postmen get the new settings the next time they open the route.</p></div>`;
  };
  draw();
  inner.oninput = e => { const k = e.target.dataset.k; if (!k) return; t[k] = e.target.type === "checkbox" ? e.target.checked : +e.target.value; if (e.target.type === "range") e.target.nextElementSibling.textContent = k === "maxFuzzyResults" ? t[k] : Math.round(t[k] * 100) + "%"; else draw(); };
  inner.onclick = async e => {
    if (e.target.closest("[data-reset]")) { t = { ...RI_DEFAULTS }; draw(); }
    if (e.target.closest("[data-save]")) { const { error } = await sb.from("routes").update({ settings: t }).eq("id", r.id); if (error) return toast.error(error.message); r.settings = t; toast.success("Configuration saved"); }
  };
}

/* ---------- System Analytics ---------- */
async function tabAnalytics(body) {
  body.innerHTML = heading("System Analytics", "View cross-route statistics and performance metrics") + `<div data-inner class="${card} text-center text-muted-foreground">Loading analytics...</div>`;
  const { data: ev = [] } = await sb.from("search_events").select("route_id,outcome,learned_mapping_used,manual_correction_made,fuzzy_matching_used,response_time_ms,normalized_transcript").limit(20000);
  const g = fieldStats(ev || []), stats = [...A.stats.values()];
  const sum = k => stats.reduce((s, x) => s + (x[k] || 0), 0);
  const tile = (l, v, ic) => `<div class="p-4 bg-card rounded-lg border border-border"><div class="flex items-center justify-between"><div><div class="text-sm text-muted-foreground">${l}</div><div class="text-3xl font-bold text-foreground mt-2">${v}</div></div>${icon(ic, 24, "text-primary")}</div></div>`;
  $("[data-inner]").outerHTML = `<div class="space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">${tile("Routes", A.routes.length, "route")}${tile("Stops", sum("stops"), "map")}${tile("Postmen with access", sum("members"), "users")}${tile("Learned Mappings", sum("corrections"), "brain")}</div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">${tile("Total Voice Searches", g.totalSearches, "activity")}${tile("Success Rate", (g.totalSearches ? (g.successfulFirstTimeMatches / g.totalSearches * 100).toFixed(1) : 0) + "%", "chart")}${tile("Avg Response Time", g.averageResponseTimeMs + "ms", "activity")}${tile("Manual Corrections", g.searchesRequiringManualCorrection, "sliders")}</div>
    <div class="${card} overflow-x-auto"><h3 class="font-semibold mb-3">By route</h3><table class="w-full text-sm"><thead><tr class="text-left text-muted-foreground border-b border-border"><th class="py-2 pr-3">Route</th><th class="py-2 pr-3">Sections</th><th class="py-2 pr-3">Stops</th><th class="py-2 pr-3">Postmen</th><th class="py-2 pr-3">Mappings</th><th class="py-2 pr-3">Voice searches logged</th><th class="py-2">Last edit</th></tr></thead>
      <tbody>${A.routes.map(r => { const s = A.stats.get(r.id) || {}; return `<tr class="border-b border-border"><td class="py-2 pr-3 font-semibold">${esc(r.name)}</td><td class="py-2 pr-3">${s.sections ?? 0}</td><td class="py-2 pr-3">${s.stops ?? 0}</td><td class="py-2 pr-3">${s.members ?? 0}</td><td class="py-2 pr-3">${s.corrections ?? 0}</td><td class="py-2 pr-3">${s.searches ?? 0}</td><td class="py-2">${fmtDate(s.last_edit)}</td></tr>`; }).join("")}</tbody></table></div></div>`;
}

/* ---------- boot ---------- */
const state = { user: null };
async function boot() {
  if (!sb) { $("#root").innerHTML = `<div class="min-h-screen flex items-center justify-center p-6 text-center text-sm text-muted-foreground">Fill in SUPABASE_URL and SUPABASE_ANON_KEY in the CONFIG block of admin.html.</div>`; return; }
  const { data: { session } } = await sb.auth.getSession();
  state.user = session?.user;
  const { data: isAdmin } = state.user ? await sb.rpc("is_admin") : { data: false };
  if (!state.user || !isAdmin) {
    $("#root").innerHTML = `<div class="min-h-screen flex flex-col items-center justify-center bg-background px-6"><div class="text-center max-w-sm w-full">
      <div class="w-16 h-16 rounded-full bg-primary flex items-center justify-center mx-auto mb-4 shadow-lg">${icon("shield", 28, "text-primary-foreground")}</div>
      <h1 class="text-3xl font-bold text-primary mb-2">RouteLog Admin</h1>
      ${state.user ? `<p class="text-sm text-muted-foreground mb-4">${esc(state.user.email)} isn't an admin.</p>` : ""}
      <form class="flex flex-col gap-3"><input name="email" type="email" required placeholder="Email" class="rl-input h-12 text-center rounded-full"><input name="password" type="password" required placeholder="Password" class="rl-input h-12 text-center rounded-full">
      <p data-err class="text-sm text-destructive"></p><button class="w-full h-10 rounded-full shadow bg-primary text-primary-foreground font-medium text-sm">Sign in</button></form>
      <a href="index.html" class="text-xs text-primary underline mt-4 inline-block">Back to the app</a></div></div>`;
    $("form").onsubmit = async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); const { error } = await sb.auth.signInWithPassword(f); if (error) return ($("[data-err]").textContent = error.message); boot(); };
    return;
  }
  shell();
}
boot();

</script>
</body>
