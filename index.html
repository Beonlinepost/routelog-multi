@layer base{a{color:inherit;text-decoration:none}}
/* RouteLog additions (not in the original compiled Tailwind) */
.rl-input{width:100%;border:1px solid var(--input);background:transparent;padding:0 .75rem;font-size:.95rem;outline:none;color:var(--foreground)}
.rl-input:focus{box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 35%,transparent);border-color:var(--ring)}
#toasts{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.rl-toast{background:#fff;color:var(--foreground);border:1px solid var(--border);box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:10px;padding:10px 16px;font-size:13px;font-weight:500;transition:opacity .3s;max-width:90vw}
.rl-toast-error{border-color:#fca5a5;color:#b91c1c}
.rl-toast-success{border-left:4px solid #16a34a}
.rl-sheet{animation:rl-up .2s ease-out}
@keyframes rl-up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}

async function fetchAll(table, filter, order) {
  const out = []; const page = 1000;
  for (let from = 0; ; from += page) {
    let q = sb.from(table).select("*");
    for (const [k, v] of Object.entries(filter)) q = q.eq(k, v);
    for (const o of order) q = q.order(o);
    const { data, error } = await q.range(from, from + page - 1);
    if (error) throw error;
    out.push(...data);
    if (data.length < page) break;
  }
  return out;
}

/* =====================================================================

   ===================================================================== */
function norm(t) {
  return t.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[''`]/g, "").replace(/\s+/g, " ").trim();

function splitPipe(t) { return t ? t.split("|").map(r => r.trim()).filter(Boolean) : []; }

function matchMultiWord(stop, q) {

    if (b.includes(q)) return { matched: true, kind: "business", matchedBusiness: stop.businessName };
    if (bj.includes(joined) || joined.includes(bj)) { const f = words[0]; if (f && b.includes(f)) return { matched: true, kind: "business", matchedBusiness: stop.businessName }; }
    if (bw.length >= 2 && words.length >= 2 && bw.every(p => p.length >= 2 && q.includes(p)) && words.every(p => p.length >= 2 && b.includes(p)))
      return { matched: true, kind: "business", matchedBusiness: stop.businessName };

    const n = norm(r);
    if (n.includes(q)) return { matched: true, kind: "resident", matchedResident: r };
    const nj = n.replace(/ /g, "");
    if (nj.includes(joined) || joined.includes(nj)) { const f = words[0]; if (f && n.includes(f)) return { matched: true, kind: "resident", matchedResident: r }; }
  }
  return null;
}

}

  }

  if (words.some(f => f.length >= 2 && hay.includes(f))) {
    for (const r of residents) if (words.some(p => norm(r).includes(p))) return { matched: true, kind: "resident", matchedResident: r };

/* Eircode said or typed: "F94 W9X5", "F 9 4 W 9 X 5", or just the last four "W9X5" */
const NUMWORDS = { zero: "0", oh: "0", one: "1", two: "2", to: "2", too: "2", three: "3", four: "4", for: "4", five: "5", six: "6", seven: "7", eight: "8", ate: "8", nine: "9" };

    const u = stops.filter(p => matchMultiWord(p, q) !== null);
    if (u.length) return { level: 1, results: u };
    const f = RI_CFG.enableAliasMatching !== false ? stops.filter(p => matchAliasMulti(p, q) !== null) : [];

/* =====================================================================

   ===================================================================== */
const RI_DEFAULTS = {

function levenshtein(t, r) {
  const a = [];
  for (let o = 0; o <= r.length; o++) a[o] = [o];
  for (let o = 0; o <= t.length; o++) a[0][o] = o;
  for (let o = 1; o <= r.length; o++) for (let l = 1; l <= t.length; l++)
    a[o][l] = r.charAt(o - 1) === t.charAt(l - 1) ? a[o - 1][l - 1] : Math.min(a[o - 1][l - 1] + 1, a[o][l - 1] + 1, a[o - 1][l] + 1);

function openEditModal({ stop, section, isNew, onSaved, onClose }) {
  let aliases = splitPipe(stop.aliases), dog = !!stop.hasDog;
  const Vr = "w-full rounded-lg border border-border bg-background px-3 py-2 text-sm text-foreground focus:outline-none focus:ring-2 focus:ring-primary";
  const Ub = Vr + " resize-none";
  const field = (label, inner, hint) => `<div class="space-y-1"><label class="text-xs font-semibold text-muted-foreground uppercase tracking-wide">${label}</label>${inner}${hint ? `<p class="text-xs text-muted-foreground/70">${hint}</p>` : ""}</div>`;
  const select = (name, val, opts) => `<div class="relative"><select name="${name}" class="${Vr} appearance-none pr-8"><option value="">— not set —</option>${opts.map(o => `<option ${o === val ? "selected" : ""}>${o}</option>`).join("")}</select>${icon("chevronDown", 14, "absolute right-3 top-1/2 -translate-y-1/2 text-muted-foreground pointer-events-none")}</div>`;
  const input = (name, val, ph = "") => `<input type="text" name="${name}" value="${esc(val ?? "")}" placeholder="${esc(ph)}" class="${Vr}">`;
  const el = document.createElement("div");
  el.innerHTML = `<div class="fixed inset-0 bg-black/50 z-40" data-close></div>
  <div class="fixed inset-x-0 bottom-0 z-50 bg-background rounded-t-2xl shadow-2xl max-h-[92dvh] flex flex-col rl-sheet">
    <div class="flex items-center justify-between px-4 pt-3 pb-2 border-b border-border shrink-0">
      <div><p class="text-xs text-muted-foreground">Box ${section.boxNumber} · ${esc(section.name)} · Stop #${stop.stopOrder}</p>

    </div>
    <form class="flex-1 overflow-y-auto px-4 py-4 space-y-5">
      ${field("Side", select("side", stop.side, ["Left", "Right"]))}
      ${field("Property Type", select("propertyType", stop.propertyType, ["Residential", "Business", "Holiday House", "Vacant"]))}
      <div data-biz>${field("Business Name", input("businessName", stop.businessName, "e.g. Kelly's Pharmacy, McGinley's Garage"), "Primary callback target — spoken first in voice callback")}</div>
      ${field("Residents (pipe-separated)", `<textarea name="residents" rows="3" placeholder="James McCullagh | Anne McCullagh" class="${Ub}">${esc(stop.residents ?? "")}</textarea>`, "Separate multiple residents with | — displayed with commas on cards")}
      ${field("Aliases — Speech Recovery", `<div class="rounded-xl border-2 border-primary/20 bg-primary/5 px-3 pt-3 pb-2 space-y-2">
          <p class="text-xs font-semibold text-primary uppercase tracking-wide">Pronunciation variants · OCR misfires · Surname alternatives</p>
          <div class="space-y-2"><div data-chips class="flex flex-wrap gap-1.5"></div>
            <div class="flex gap-2"><input data-alias type="text" class="${Vr} flex-1">
              <button type="button" data-add-alias class="shrink-0 flex items-center gap-1 px-3 py-2 rounded-lg bg-primary text-primary-foreground text-sm font-semibold hover:opacity-90 disabled:opacity-40 transition-opacity">${icon("plus", 14)}Add</button></div>

          </div></div>`)}
      ${field("Address / House Name", input("houseName", stop.houseName, "e.g. Seaview, The Old Forge, Tigh Mháire"))}
      <div class="grid grid-cols-2 gap-3">${field("House Number", input("houseNumber", stop.houseNumber))}${field("Eircode", input("eircode", stop.eircode))}</div>
      ${field("Route Reference", input("road", stop.road))}
      ${field("Parcel Drop-Off", input("safePlace", stop.safePlace, "e.g. Porch, Shed, Side Gate, Neighbour at No. 4"))}
      ${field("Delivery Notes", `<textarea name="notes" rows="3" placeholder="e.g. Red door. Long lane. Two white pillars." class="${Ub}">${esc(stop.notes ?? "")}</textarea>`)}

    aliasInput.placeholder = aliases.length ? "Add another alias…" : "e.g. MacCullagh, McCullah, Macula…";
  };
  const addAlias = () => { const p = aliasInput.value.trim(); if (p && !aliases.some(g => g.toLowerCase() === p.toLowerCase())) aliases.push(p); aliasInput.value = ""; drawChips(); aliasInput.focus(); };
  const drawDog = () => {
    const b = $("[data-dog]", el);
    b.className = `flex items-center gap-2 px-3 py-2 rounded-lg border text-sm font-bold uppercase tracking-wide transition-colors ${dog ? "bg-red-50 border-red-400 text-red-700" : "bg-background border-border text-muted-foreground hover:border-red-300"}`;

  };

  drawChips(); drawDog(); drawBiz();
  form.propertyType.addEventListener("change", drawBiz);
  aliasInput.addEventListener("keydown", e => {
    if (["Enter", ",", "|"].includes(e.key)) { e.preventDefault(); addAlias(); }
    if (e.key === "Backspace" && !aliasInput.value && aliases.length) { aliases.pop(); drawChips(); }
  });
  $("[data-add-alias]", el).onclick = addAlias;
  $("[data-chips]", el).onclick = e => { const b = e.target.closest("[data-rm]"); if (b) { aliases.splice(+b.dataset.rm, 1); drawChips(); } };
  $("[data-dog]", el).onclick = () => { dog = !dog; drawDog(); };
  const close = () => { document.removeEventListener("keydown", onKey); el.remove(); onClose?.(); };
  const onKey = e => { if (e.key === "Escape") close(); };
  document.addEventListener("keydown", onKey);
  $$("[data-close]", el).forEach(b => (b.onclick = close));
  $("[data-save]", el).onclick = async () => {
    const f = Object.fromEntries(new FormData(form));
    const surnames = new Set(splitPipe(f.residents).flatMap(a => { const w = a.split(/\s+/); return w.length >= 2 ? [w[w.length - 1].toLowerCase()] : []; }));
    const keep = aliases.filter(a => { const w = a.trim().split(/\s+/).filter(Boolean); return w.length === 1 ? !surnames.has(w[0].toLowerCase()) : true; });
    const row = {
      side: f.side || null, property_type: f.propertyType || null, business_name: f.businessName || null,
      residents: f.residents || null, aliases: keep.length ? keep.join(" | ") : null, notes: f.notes || null,
      safe_place: f.safePlace || null, has_dog: dog, house_name: f.houseName || null, house_number: f.houseNumber || null,
      road: f.road || null, eircode: f.eircode || null
    };
    const btn = $("[data-save]", el); btn.disabled = true; $("span", btn).textContent = "Saving…";
    let data, error;
    try { ({ data, error } = await sb.from("stops").update(row).eq("id", stop.id).select().single()); } catch (e) { error = e; }
    if (error && OFF.isNetErr(error)) {
      OFF.push({ type: "update", id: stop.id, row });
      toast.success("Saved on this phone — will sync when there's signal");
      document.removeEventListener("keydown", onKey); el.remove();
      return onSaved(toStop({ ...fromStop(stop), ...row }));
    }
    if (error) { toast.error("Save failed: " + error.message); btn.disabled = false; $("span", btn).textContent = "Save Changes"; return; }
    toast.success("Stop saved");
    document.removeEventListener("keydown", onKey); el.remove();
    onSaved(toStop(data));
  };
}

/* =====================================================================
   OFFLINE: cached route data + write queue
   ===================================================================== */
const OFF = {
  key: "rl-queue",
  get() { try { return JSON.parse(lsGet(this.key, "[]")); } catch { return []; } },
  set(q) { lsSet(this.key, JSON.stringify(q)); OFF.badge(); },
  push(op) { const q = this.get(); q.push({ ...op, at: Date.now() }); this.set(q); },
  isNetErr(e) { return !navigator.onLine || /fetch|network|Failed to fetch|Load failed|NetworkError/i.test(String(e?.message || e)); },
  badge() { const n = this.get().length, b = $("#rl-offline"); if (!b) return; b.style.display = !navigator.onLine || n ? "" : "none"; b.textContent = !navigator.onLine ? `Offline${n ? ` · ${n} change${n > 1 ? "s" : ""} waiting to sync` : " · working from saved route"}` : `Syncing ${n} change${n > 1 ? "s" : ""}…`; },
  busy: false,
  async flush() {
    if (this.busy || !navigator.onLine || !sb) return;
    let q = this.get(); if (!q.length) return;
    this.busy = true;
    try {
      while (q.length) {
        const op = q[0]; let res;
        if (op.type === "update") res = await sb.from("stops").update(op.row).eq("id", op.id);
        else if (op.type === "parcel") res = await sb.rpc("log_item", { p_stop_id: op.stopId, p_count: op.count, p_via: op.via, p_kind: op.kind || "parcel", p_token: op.token || null });
        else if (op.type === "mark") res = await sb.rpc("mark_stop", { p_stop_id: op.stopId, p_status: op.status, p_token: op.token || null });
        else if (op.type === "pin") res = await sb.rpc("pin_stop", { p_stop_id: op.stopId, p_lat: op.lat, p_lng: op.lng, p_token: op.token || null });
        else if (op.type === "unparcel") res = op.token ? await sb.rpc("delete_parcel_public", { p_token: op.token, p_parcel_id: op.parcelId })
                                                        : await sb.from("parcels").delete().eq("id", op.parcelId);
        else if (op.type === "correction") res = op.token ? await sb.rpc("record_correction_public", { p_token: op.token, p_stop_id: op.stopId, p_original: op.original, p_normalized: op.normalized })
                                                          : await sb.rpc("record_correction", { p_route_id: op.routeId, p_stop_id: op.stopId, p_original: op.original, p_normalized: op.normalized, p_tags: op.tags || [] });
        if (res?.error && this.isNetErr(res.error)) break;          // still offline → try later
        if (res?.error) console.warn("[Sync] dropped op", op, res.error); // real error → drop it
        q.shift(); this.set(q);
      }
      if (!q.length) toast.success("All changes synced");
    } catch (e) { console.warn("[Sync]", e); }
    finally { this.busy = false; this.badge(); }
  }
};
window.addEventListener("online", () => { OFF.badge(); OFF.flush(); });
window.addEventListener("offline", () => OFF.badge());
setInterval(() => OFF.flush(), 30000);

const todayStr = () => new Date().toLocaleDateString("en-CA", { timeZone: "Europe/Dublin" });

async function loadMemberBundle(routeId) {
  const cacheKey = `rl-route-${routeId}`;
  try {
    const [{ data: route, error: e1 }, secRows, stopRows, canEditRes, parcelRes, delRes] = await Promise.all([
      sb.from("routes").select("*").eq("id", routeId).maybeSingle(),
      fetchAll("sections", { route_id: routeId }, ["position", "box_number"]),
      fetchAll("stops", { route_id: routeId }, ["section_id", "stop_order"]),
      sb.rpc("can_edit_route", { p_route: routeId }),
      sb.from("parcels").select("id,stop_id,count,via,kind,created_at").eq("route_id", routeId).eq("log_date", todayStr()),
      sb.from("deliveries").select("stop_id,status").eq("route_id", routeId).eq("log_date", todayStr())
    ]);
    if (e1) throw e1;
    if (!route) return null;
    const b = { route, sections: secRows, stops: stopRows, canEdit: !!canEditRes?.data, parcels: parcelRes?.data || [], deliveries: delRes?.data || [], day: todayStr(), savedAt: Date.now() };
    try { localStorage.setItem(cacheKey, JSON.stringify(b)); lsSet("rl-last-route", String(routeId)); } catch {}
    return b;
  } catch (e) {
    const c = lsGet(cacheKey); if (!c) throw e;
    const b = JSON.parse(c); b.offline = true; if (b.day !== todayStr()) { b.parcels = []; b.deliveries = []; }
    return b;
  }
}
async function loadShareBundle(token) {
  const cacheKey = `rl-share-${token}`;
  try {
    const [{ data, error }, p, d] = await Promise.all([sb.rpc("get_public_summary", { p_token: token }), sb.rpc("parcels_today_public", { p_token: token }), sb.rpc("deliveries_today_public", { p_token: token })]);
    if (error) throw error;
    if (!data) return null;
    const b = { route: data.route, sections: data.sections, stops: data.stops, canEdit: false, parcels: p?.data || [], deliveries: d?.data || [], day: todayStr(), savedAt: Date.now() };
    try { localStorage.setItem(cacheKey, JSON.stringify(b)); } catch {}
    return b;
  } catch (e) {
    const c = lsGet(cacheKey); if (!c) throw e;
    const b = JSON.parse(c); b.offline = true; if (b.day !== todayStr()) { b.parcels = []; b.deliveries = []; }
    return b;
  }
}

/* Parcel phrase: "McGinley, one parcel" / "Rita McGinley two parcels" / "parcel for McGinley" */
const NUMS = { a: 1, an: 1, one: 1, won: 1, two: 2, to: 2, too: 2, three: 3, four: 4, for: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10 };
function parseParcel(t) {
  const s = t.trim().replace(/[.!?]+$/, "");
  let m = s.match(/^(.*?)[,\s]+(?:(\d+|a|an|one|won|two|to|too|three|four|for|five|six|seven|eight|nine|ten)\s+)?(?:parcels?|packets?|packages?|boxes)$/i);
  if (m && m[1].trim()) return { name: m[1].trim(), count: m[2] ? (+m[2] || NUMS[m[2].toLowerCase()] || 1) : 1 };
  m = s.match(/^(?:(\d+|a|an|one|two|three|four|five|six|seven|eight|nine|ten)\s+)?(?:parcels?|packets?|packages?)\s+(?:for\s+)?(.+)$/i);
  if (m && m[2].trim()) return { name: m[2].trim(), count: m[1] ? (+m[1] || NUMS[m[1].toLowerCase()] || 1) : 1 };
  return null;
}
const countWord = n => ["", "One parcel", "Two parcels", "Three parcels", "Four parcels", "Five parcels"][n] || `${n} parcels`;

function toastAction(msg, label, fn, ms = 6000) {
  let box = $("#toasts"); const el = document.createElement("div");
  el.className = "rl-toast rl-toast-success"; el.style.pointerEvents = "auto"; el.style.display = "flex"; el.style.gap = "12px"; el.style.alignItems = "center";
  el.innerHTML = `<span>${esc(msg)}</span><button class="font-semibold text-primary underline">${esc(label)}</button>`;
  box.appendChild(el);
  $("button", el).onclick = () => { fn(); el.remove(); };
  setTimeout(() => { el.style.opacity = "0"; setTimeout(() => el.remove(), 300); }, ms);
}

function renderRoute(B) {
  const { route, routeId, token } = B, share = !!token;
  RI_CFG = { ...RI_DEFAULTS, ...(route.settings || {}) };
  const sections = B.sections.map(toSection);
  let all = B.stops.map(toStop);
  const canEdit = !share && B.canEdit && !B.offlineEditsBlocked;
  let parcels = (B.parcels || []).map(p => ({ id: p.id, stopId: p.stop_id ?? p.stopId, count: p.count, kind: p.kind || "parcel" }));
  const deliv = new Map((B.deliveries || []).map(d => [d.stop_id, d.status]));
  const FT_KEY = "routelog:fieldTestMode";
  const S = {
    sectionId: sections[0]?.id ?? 0, query: "", mode: lsGet("rl-mode-" + routeId) === "van" ? "van" : "sorting", vanAll: false, reorder: false, parcelList: false,
    fieldTest: share || lsGet(FT_KEY) !== "false", voiceErr: null, lastCtx: null, searchStart: null, riPick: null, pendingParcel: null
  };
  const ri = new RouteIntelligence(routeId); ri.token = token; ri.build(all); ri.loadLearned();
  const sectionStops = () => all.filter(s => s.sectionId === S.sectionId).sort((a, b) => a.stopOrder - b.stopOrder);
  const curSection = () => sections.find(x => x.id === S.sectionId);
  const pool = () => (S.mode === "delivery" ? sectionStops() : all);
  const onlyParcels = () => parcels.filter(p => p.kind !== "letter");

  const letterCount = id => parcels.filter(p => p.kind === "letter" && p.stopId === id).reduce((n, p) => n + p.count, 0);
  const secParcels = sid => onlyParcels().reduce((n, p) => n + (all.find(s => s.id === p.stopId)?.sectionId === sid ? p.count : 0), 0);
  const zoneOf = stop => sections.find(x => x.id === stop.sectionId)?.vanZone || null;
  const shelfWords = stop => { const z = zoneOf(stop); return z ? (/^(shelf|cage|front|back|left|right|rack)/i.test(z) ? z : `Shelf ${z}`) : ""; };
  const btnIcon = "p-2 rounded-full hover:bg-white/10 transition-colors";

  mount(`<div class="min-h-screen bg-background flex flex-col">
    <div id="rl-offline" class="bg-amber-500 text-white text-xs font-semibold text-center py-1 px-3" style="display:none"></div>
    <header class="sticky top-0 z-20 bg-primary text-primary-foreground shadow-md no-print">
      <div class="flex items-center justify-between px-3 pt-3 pb-1.5">
        <div class="min-w-0"><h1 class="text-base font-display font-bold leading-tight">${esc(route.name)}</h1><p data-sub class="text-xs text-primary-foreground/70"></p></div>
        <div class="flex items-center gap-1">
          ${canEdit ? `<button data-reorder title="Reorder stops" class="${btnIcon}">${icon("updown", 17)}</button>` : ""}
          ${share ? "" : `<a href="#/route/${routeId}/map" class="${btnIcon}" title="Map view">${icon("map", 17)}</a>
          <a href="#/route/${routeId}/print" class="${btnIcon}" title="Print view">${icon("printer", 17)}</a>
          <button data-export class="${btnIcon}" title="Export learned mappings (JSON)">${icon("download", 17)}</button>
          <button data-ft class="p-2 rounded-full transition-colors">${icon("flask", 17)}</button>
          <a href="#/routes" class="${btnIcon}" title="All routes">${icon("route", 17)}</a>`}
        </div>
      </div>
      <div data-tabs class="flex gap-1.5 overflow-x-auto scrollbar-hide px-3 pb-2"></div>
      <div data-searchrow class="flex items-center gap-2 px-3 pb-2.5">
        <div class="relative flex-1">
          ${icon("search", 14, "absolute left-2.5 top-1/2 -translate-y-1/2 text-muted-foreground")}
          <input data-q type="text" placeholder="Search residents, aliases…" class="w-full pl-8 pr-8 py-1.5 rounded-full text-sm bg-white text-foreground placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-accent">
          <button data-clear class="absolute right-2.5 top-1/2 -translate-y-1/2 text-muted-foreground hover:text-foreground" style="display:none">${icon("x", 14)}</button>
        </div>
        <button data-mic class="shrink-0 p-2 rounded-full transition-all"></button>
        <button data-audio title="One-time iOS audio unlock" class="shrink-0 px-2 py-1 rounded-full bg-yellow-500 text-white hover:bg-yellow-600 active:bg-yellow-700 transition-colors text-xs font-bold pointer-events-auto z-10">Audio</button>
      </div>
      <div data-reorderhint class="px-3 pb-2.5" style="display:none"><p class="text-xs text-primary-foreground/70 text-center">Drag handles to reorder · tap ⇅ again to exit</p></div>
      <div data-modes class="flex gap-1.5 px-3 pb-2.5">
        ${["sorting", "delivery", "parcel", "van"].map(m => `<button data-mode="${m}" class="flex-1 py-1.5 rounded-lg text-xs font-semibold transition-all">${m[0].toUpperCase() + m.slice(1)}</button>`).join("")}
      </div>
      <p data-verr class="text-xs text-red-300 px-3 pb-1" style="display:none"></p>
    </header>
    <div data-boxready class="px-3 py-2.5 bg-accent/10 border-b border-accent/20" style="display:none"><p class="text-sm font-semibold text-accent-foreground"></p></div>
    <div data-parcelbar class="px-3 py-2 bg-yellow-50 border-b border-yellow-200 flex items-center gap-2" style="display:none">
      <p class="text-sm font-semibold text-yellow-900 flex-1"></p>
      <button data-plist class="text-xs font-semibold px-3 py-1 rounded-full bg-yellow-500 text-white"></button>
    </div>
    <div data-count class="px-3 py-2 text-xs text-muted-foreground no-print"></div>
    <main data-list class="flex-1 px-3 pb-6 space-y-2"></main>
    <p data-foot class="text-center text-xs text-muted-foreground/50 mt-2 pb-4 px-3"></p>
  </div>`);
  if (sessionStorage) sessionStorage.setItem("rl-stay", "1");
  OFF.badge(); OFF.flush();

  const qEl = $("[data-q]"), listEl = $("[data-list]");
  let sortable = null;

  /* ---- speech out ---- */
  const voice = createVoice((t, fin) => onTranscript(t, fin), e => { S.voiceErr = e; drawHeader(); }, () => drawMic());
  function speak(text) {
    if (!("speechSynthesis" in window)) return;
    voice.speakingStart();
    const u = new SpeechSynthesisUtterance(sayable(text)); u.rate = 1.12;
    const v = pickVoice(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-GB";
    const len = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? text.length : 0;
    let done = false; const fin = () => { if (!done) { done = true; voice.speakingEnd(len); } };
    const wd = Math.min(4000, Math.max(600, text.length * 80));
    const guard = setTimeout(() => { console.warn("[Voice] utterance.onend never fired — forcing mic restart"); fin(); }, 150 + wd * 2);
    u.onend = () => { clearTimeout(guard); fin(); }; u.onerror = () => { clearTimeout(guard); fin(); };
    const ios = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    setTimeout(() => { try { window.speechSynthesis.cancel(); window.speechSynthesis.resume?.(); window.speechSynthesis.speak(u); } catch (e) { console.warn("[Voice] speak failed", e); fin(); } }, ios ? 120 : 60);
  }
  function callout(stop, name) {
    const p = [];
    if (S.mode === "sorting") { if (name) p.push(name); if (stop.road) p.push(stop.road); }
    else if (S.mode === "delivery") p.push(`Stop ${stop.stopOrder}`);
    else { if (name) p.push(name); p.push(`Stop ${stop.stopOrder}`); }
    return p.join(". ");
  }
  const ctx = (t, level, results) => ({ transcript: t, normalizedTranscript: normTranscript(t), matchLevel: level, matchResults: results, timestamp: Date.now() });

  /* resolve a spoken name to exactly one stop (or null + results) */
  const nameFor = (stop, t) => { const cp = coupleNames(t); return cp ? spokenName(stop, matchStop(stop, cp[0]).matched ? matchStop(stop, cp[0]) : matchStop(stop, cp[1])) : spokenName(stop, matchStop(stop, t)); };
  async function resolve(t) {
    const P = pool(); if (!P.length) return { stop: null, results: [], level: 0 };
    const special = (eircodeMatches(P, t) || coupleNames(t)) ? searchStops(P, t) : null;
    if (special && special.results.length) return { stop: special.results.length === 1 ? special.results[0] : null, results: special.results, level: 1, multi: special.results.length > 1 };
    if (RI_CFG.enabled !== false) {
      try { const rr = await ri.search(t), hit = pickConfident(rr, P); if (hit) return { stop: hit, results: [hit], level: 3, ri: true, learned: /learned/.test(rr.find(x => x.stopId === hit.id)?.matchType || "") }; }
      catch (x) { console.warn("[RI] search failed, falling back:", x); }
    }
    const { level, results } = searchStops(P, t);
    if (!results.length) return { stop: null, results, level };
    if (level === 1 || level === 2) {
      const n = exactCount(results, t);
      if (n === 1) return { stop: exactFirst(results, t)[0], results, level };
      if (n === 0 && results.length === 1) return { stop: results[0], results, level };
      if (n === 0) return { stop: results[0], results, level, weak: true };
      return { stop: null, results, level, multi: true };
    }
    return { stop: results.length === 1 ? results[0] : null, results, level };
  }

  /* ---- field-test log: every voice search, so we can fix things as we go ---- */
  async function logSearch(heard, outcome, spoken, stop, results, learned) {
    if (!S.fieldTest) return;
    const name = stop ? (stop.businessName || splitPipe(stop.residents)[0] || `Stop ${stop.stopOrder}`) : null;
    const cand = (results || []).slice(0, 5).map(x => ({ stopId: x.id, stopName: splitPipe(x.residents)[0] || x.businessName || "", stopOrder: x.stopOrder }));
    const ms = S.searchStart ? Date.now() - S.searchStart : null;
    S.lastEventId = null;
    try {
      const { data } = await sb.rpc("log_search", { p_route_id: routeId, p_token: token, p_section_id: S.sectionId, p_heard: heard, p_outcome: outcome,
        p_spoken: spoken, p_stop_id: stop?.id ?? null, p_stop_name: name, p_candidates: cand, p_ms: ms, p_mode: S.mode, p_learned: !!learned });
      S.lastEventId = data ?? null; S.lastEventStopId = stop?.id ?? null;
    } catch (e) { console.warn("[FieldTest] log failed", e); }
  }
  function say(text, heard, outcome, stop, results, learned) { speak(text); logSearch(heard, outcome, text, stop, results, learned); }

  async function onTranscript(text, isFinal) {
    S.query = text; qEl.value = text; S.riPick = null; S.parcelList = false; drawList();
    if (!isFinal) return;
    const t = text.trim(); if (!t) return;
    S.searchStart = Date.now(); S.lastLetter = null;
    /* ---- van commands ---- */
    if (S.mode === "van") {
      const w = t.toLowerCase().replace(/[.!?]/g, "").trim();
      if (/^(delivered|done|next|got it|dropped|that's done|thats done|deliver)$/.test(w)) { S.query = ""; qEl.value = ""; const nx = vanNext(); if (nx) { markStop(nx, "delivered"); logSearch(t, "box", "delivered"); } else say("All done.", t, "box"); return; }
      if (/^(skip|skip it|skip this one|come back|later)$/.test(w)) { S.query = ""; qEl.value = ""; const nx = vanNext(); if (nx) markStop(nx, "skipped"); return; }
      if (/^(repeat|again|say again|what's next|whats next|next stop|where am i)$/.test(w)) { S.query = ""; qEl.value = ""; drawList(); return say(vanCallout(vanNext()), t, "box"); }
    }
    if (S.mode === "delivery") {
      const m = t.match(/^box\s+(\d+)$/i);
      if (m) { const n = +m[1], sec = sections.find(x => x.boxNumber === n); if (sec) { selectSection(sec.id); say(`Box ${n} ready. ${sec.name}.`, t, "box"); } else say(`Box ${n} not found.`, t, "no-match"); return; }
      if (/^next\s+box$/i.test(t)) { const i = sections.findIndex(x => x.id === S.sectionId); if (i >= 0 && i < sections.length - 1) { const nx = sections[i + 1]; selectSection(nx.id); say(`Box ${nx.boxNumber} ready. ${nx.name}.`, t, "box"); } else say("No next box.", t, "box"); return; }
    }
    /* ---- parcel logging by voice ---- */
    const pp = S.mode !== "delivery" ? parseParcel(t) : null;
    if (pp) {
      S.query = pp.name; qEl.value = pp.name; drawList();
      const r = await resolve(pp.name);
      // one-word names ("McGinley") must be unique before we log a parcel against them
      const oneWord = pp.name.split(/\s+/).filter(Boolean).length === 1;
      const learned = r.learned;
      if (r.stop && oneWord && !learned && searchStops(pool(), pp.name).results.length > 1) { r.results = searchStops(pool(), pp.name).results; r.stop = null; }
      S.lastCtx = ctx(pp.name, r.level, r.results);
      if (r.stop && !r.weak) {
        await logParcel(r.stop, pp.count, "voice");
        say(`${countWord(pp.count)}. ${spokenName(r.stop, matchStop(r.stop, pp.name)) || "Stop " + r.stop.stopOrder}. ${zoneOf(r.stop) ? shelfWords(r.stop) : (r.stop.road || "")}`.trim(), t, "parcel", r.stop, r.results, !!learned);
      } else {
        S.pendingParcel = { count: pp.count, until: Date.now() + 20000 };
        drawList();
        say(r.results.length ? `Which ${pp.name}? Tap the house` : `No match for ${pp.name}`, t, r.results.length ? "list" : "no-match", null, r.results);
      }
      return;
    }
    const r = await resolve(t);
    S.lastCtx = ctx(t, r.level, r.results);
    const multiWord = t.split(/\s+/).filter(Boolean).length >= 2;
    if (r.ri) { logLetter(r.stop); return say(callout(r.stop, nameFor(r.stop, t)), t, "found", r.stop, r.results, r.learned); }
    if (!r.results.length) { say(multiWord ? `No exact match found for ${t}` : `No match for ${t}`, t, "no-match", null, []); openSaveNameModal({ transcript: t, stops: sectionStops(), onSave: saveName }); return; }
    if (r.level === 1 || r.level === 2) {
      if (r.multi) { const w = t.split(/\s+/); return say(`Multiple ${w[w.length - 1]} matches found`, t, "list", null, r.results); }
      logLetter(r.stop);
      return say(callout(r.stop, nameFor(r.stop, t)), t, "found", r.stop, r.results);
    }
    if (S.mode === "delivery") { const s0 = r.results[0]; return say(callout(s0, spokenName(s0, matchStop(s0, t))), t, "found", s0, r.results); }
    say("Closest matches shown", t, "list", null, r.results);
  }
  async function saveName(transcript, stopId, label) {
    await ri.recordCorrection(transcript, stopId || 0, stopId ? ["user-selected"] : []);
    toast.success(`Saved: "${transcript}" → ${label}`);
  }

  /* ---- parcels ---- */
  async function logParcel(stop, count = 1, via = "tap", kind = "parcel", silent = false) {
    const tmp = { id: -Date.now() - Math.random(), stopId: stop.id, count, kind };
    parcels.push(tmp); if (!silent) { drawHeader(); drawList(); }
    let res;
    try { res = await sb.rpc("log_item", { p_stop_id: stop.id, p_count: count, p_via: via, p_kind: kind, p_token: token }); }
    catch (e) { res = { error: e }; }
    if (res.error && OFF.isNetErr(res.error)) { OFF.push({ type: "parcel", token, stopId: stop.id, count, via, kind }); tmp.queued = true; }
    else if (res.error) { parcels = parcels.filter(p => p !== tmp); drawHeader(); drawList(); if (!silent) toast.error("Couldn't log parcel: " + res.error.message); return null; }
    else tmp.id = res.data.id;
    if (!silent) {
      const name = stop.businessName || splitPipe(stop.residents)[0] || `Stop ${stop.stopOrder}`;
      toastAction(`📦 ${count} × ${name}${zoneOf(stop) ? " → " + shelfWords(stop) : ""}`, "Undo", () => undoParcel(tmp));
    }
    return tmp;
  }
  /* every name found in the sorting room = one letter for that house today */
  function logLetter(stop) {
    if (S.mode !== "sorting" || !stop) return;
    const p = logParcel(stop, 1, "voice", "letter", true);
    S.lastLetter = { promise: p, stopId: stop.id };
    p.then(() => drawTabs());
  }
  async function moveLastLetter(stop) {
    const L = S.lastLetter; S.lastLetter = null;
    if (!L || L.stopId === stop.id || S.mode !== "sorting") return;
    const it = await L.promise; if (it) undoParcel(it);
    logLetter(stop);
  }
  async function undoParcel(p) {
    if (!p) return;
    parcels = parcels.filter(x => x !== p); drawHeader(); drawList();
    if (p.queued || p.id < 0) { OFF.set(OFF.get().filter(op => !(op.type === "parcel" && op.stopId === p.stopId && op.count === p.count && (op.kind || "parcel") === p.kind))); if (p.id < 0) return; }
    const res = token ? await sb.rpc("delete_parcel_public", { p_token: token, p_parcel_id: p.id }) : await sb.from("parcels").delete().eq("id", p.id);
    if (res.error && OFF.isNetErr(res.error)) OFF.push({ type: "unparcel", token, parcelId: p.id });
  }

  /* ---- van mode ---- */
  const posOf = id => sections.findIndex(x => x.id === id);
  function vanRun() {
    const ids = new Set(parcels.map(p => p.stopId));
    const list = S.vanAll ? all : all.filter(s => ids.has(s.id));
    return [...list].sort((a, b) => posOf(a.sectionId) - posOf(b.sectionId) || a.stopOrder - b.stopOrder);
  }
  const vanNext = () => vanRun().find(s => !deliv.has(s.id));
  function vanCallout(st, prefix = "Next stop") {
    if (!st) return "All done. That's every stop for today.";
    const n = parcelCount(st.id), l = letterCount(st.id), name = st.businessName || splitPipe(st.residents)[0] || "";
    const bits = [`${prefix} ${st.stopOrder}, ${name}`];
    if (n) bits.push(`${countWord(n).toLowerCase()}${zoneOf(st) ? " from " + shelfWords(st) : ""}`);
    if (l) bits.push(l === 1 ? "one letter" : `${l} letters`);

  async function markStop(st, status) {
    if (!st) return;

    if (status) deliv.set(st.id, status); else deliv.delete(st.id);
    drawList();
    let res; try { res = await sb.rpc("mark_stop", { p_stop_id: st.id, p_status: status || "undo", p_token: token }); } catch (e) { res = { error: e }; }
    if (res.error && OFF.isNetErr(res.error)) OFF.push({ type: "mark", token, stopId: st.id, status: status || "undo" });
    else if (res.error) { if (prev) deliv.set(st.id, prev); else deliv.delete(st.id); drawList(); return toast.error(res.error.message); }
    if (status) {
      toastAction(`${status === "delivered" ? "✓ Delivered" : "↷ Skipped"}: ${splitPipe(st.residents)[0] || st.businessName || "Stop " + st.stopOrder}`, "Undo", () => markStop(st, null));
      speak(vanCallout(vanNext()));
    }
  }
  function directionsUrl(st) {
    const e = (st.eircode || "").replace(/\s/g, "");
    const dest = st.lat && st.lng ? `${st.lat},${st.lng}` : e.length === 7 ? e : [st.houseName, st.businessName, st.road, route.name.replace(/ route$/i, ""), "Co. Donegal"].filter(Boolean).join(", ");
    return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(dest)}&travelmode=driving`;
  }
  function pinStop(st) {
    if (!navigator.geolocation) return toast.error("This phone can't share its location");
    toast.info("Getting your location…");
    navigator.geolocation.getCurrentPosition(async pos => {
      const lat = +pos.coords.latitude.toFixed(6), lng = +pos.coords.longitude.toFixed(6);
      let res; try { res = await sb.rpc("pin_stop", { p_stop_id: st.id, p_lat: lat, p_lng: lng, p_token: token }); } catch (e) { res = { error: e }; }
      if (res.error && OFF.isNetErr(res.error)) OFF.push({ type: "pin", token, stopId: st.id, lat, lng });
      else if (res.error) return toast.error(res.error.message);
      st.lat = lat; st.lng = lng; cacheStops(); drawList();
      toast.success(`📍 Pinned ${splitPipe(st.residents)[0] || st.businessName || "stop " + st.stopOrder} (±${Math.round(pos.coords.accuracy)} m)`);
    }, err => toast.error(err.code === 1 ? "Allow location for this site to pin houses" : "Couldn't get your location"), { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
  }
  function drawVan() {
    const run = vanRun(), next = vanNext(), done = run.filter(s => deliv.get(s.id) === "delivered").length, skipped = run.filter(s => deliv.get(s.id) === "skipped");
    $("[data-count]").textContent = run.length ? `${done} of ${run.length} delivered${skipped.length ? ` · ${skipped.length} skipped` : ""} · ${S.vanAll ? "whole route" : "today's post only"}` : "";
    if (!run.length) {
      listEl.innerHTML = `<div class="text-center py-10 px-4 space-y-3"><p class="text-base font-semibold">Nothing sorted for today yet</p>
        <p class="text-sm text-muted-foreground">Van mode builds today's run from the sorting room: every name found in <b>Sorting</b> (letters) and every parcel logged in <b>Parcel</b> mode.</p>
        <button data-vanall class="px-4 py-2 rounded-full bg-primary text-primary-foreground text-sm font-semibold">Use the whole route instead</button></div>`;
      $("[data-foot]").textContent = ""; return;
    }
    const chip = (t, cls) => `<span class="inline-flex items-center px-2.5 py-1 rounded-full text-sm font-bold ${cls}">${t}</span>`;
    let html = "";
    if (next) {
      const n = parcelCount(next.id), l = letterCount(next.id), sec = sections.find(x => x.id === next.sectionId), names = splitPipe(next.residents);
      html += `<div class="bg-white rounded-2xl border-2 border-primary shadow-lg p-4 space-y-3">
        <div class="flex items-center justify-between"><span class="text-xs font-bold uppercase tracking-wide text-primary/70">Next stop · Box ${sec?.boxNumber ?? ""} · #${next.stopOrder}</span>${next.eircode ? `<span class="font-mono text-sm font-bold">${esc(next.eircode)}</span>` : ""}</div>
        <p class="text-2xl font-bold leading-tight">${esc(next.businessName || names[0] || "Stop " + next.stopOrder)}</p>
        ${names.length > 1 || next.businessName ? `<p class="text-sm text-muted-foreground">${esc((next.businessName ? names : names.slice(1)).join(", "))}</p>` : ""}
        ${[next.houseName, next.houseNumber, next.road].filter(Boolean).length ? `<p class="text-sm">${esc([next.houseName, next.houseNumber, next.road].filter(Boolean).join(", "))}</p>` : ""}
        <div class="flex flex-wrap gap-2">${n ? chip(`📦 ${n} parcel${n > 1 ? "s" : ""}${zoneOf(next) ? " · " + esc(shelfWords(next)) : ""}`, "bg-yellow-400 text-yellow-950") : ""}${l ? chip(`✉️ ${l} letter${l > 1 ? "s" : ""}`, "bg-sky-100 text-sky-700") : ""}${next.hasDog ? chip("🐕 DOG", "bg-red-100 text-red-700") : ""}</div>
        ${next.safePlace ? `<p class="text-base font-semibold text-yellow-900 bg-yellow-50 border border-yellow-200 rounded-lg px-3 py-2">Drop-off: ${esc(next.safePlace)}</p>` : ""}
        ${next.notes ? `<p class="text-sm text-slate-700 bg-slate-50 border border-slate-200 rounded-lg px-3 py-2 whitespace-pre-line">${esc(next.notes)}</p>` : ""}
        <div class="grid grid-cols-2 gap-2 pt-1">
          <button data-van="delivered" class="col-span-2 py-4 rounded-xl bg-emerald-600 text-white text-lg font-bold shadow">✓ Delivered</button>
          <a href="${directionsUrl(next)}" target="_blank" rel="noopener" class="py-3 rounded-xl bg-primary text-primary-foreground text-sm font-bold text-center">🧭 Directions</a>
          <button data-van="skipped" class="py-3 rounded-xl border border-border bg-background text-sm font-bold">↷ Skip for now</button>

          <button data-van="say" class="py-3 rounded-xl border border-border bg-background text-sm font-semibold">🔊 Say it again</button>
        </div></div>`;
    } else html += `<div class="bg-emerald-50 border-2 border-emerald-300 rounded-2xl p-6 text-center"><p class="text-2xl font-bold text-emerald-800">All done ✓</p><p class="text-sm text-emerald-800 mt-1">${done} delivered${skipped.length ? ` · ${skipped.length} skipped — tap one below to go back to it` : ""}</p></div>`;
    const upcoming = run.filter(s => !deliv.has(s.id) && s !== next).slice(0, 8);
    if (upcoming.length) html += `<p class="text-xs font-bold uppercase tracking-wide text-muted-foreground pt-3 px-1">Coming up</p>` + upcoming.map(s => {
      const n = parcelCount(s.id), l = letterCount(s.id);
      return `<div class="bg-white rounded-xl border px-3 py-2 flex items-center gap-2"><span class="text-xs font-bold text-muted-foreground w-8">#${s.stopOrder}</span><span class="flex-1 font-semibold text-sm truncate">${esc(s.businessName || splitPipe(s.residents)[0] || "Stop " + s.stopOrder)}</span>${n ? `<span class="text-xs font-bold">📦${n}${zoneOf(s) ? " " + esc(zoneOf(s)) : ""}</span>` : ""}${l ? `<span class="text-xs">✉️${l}</span>` : ""}${s.hasDog ? "🐕" : ""}</div>`;

    if (skipped.length) html += `<p class="text-xs font-bold uppercase tracking-wide text-muted-foreground pt-3 px-1">Skipped · tap to put back</p>` + skipped.map(s => `<button data-unskip="${s.id}" class="w-full text-left bg-white rounded-xl border border-dashed px-3 py-2 text-sm">#${s.stopOrder} ${esc(s.businessName || splitPipe(s.residents)[0] || "")}</button>`).join("");
    listEl.innerHTML = html;
    $("[data-foot]").innerHTML = `Say “delivered”, “skip” or “repeat”. On the van screen: “Hey Google, navigate to” + the eircode. ` +
      (S.vanAll ? `<button data-vantoday class="underline">Today's post only</button>` : `<button data-vanall class="underline">Show whole route</button>`);
  }

  /* ---- drawing ---- */
  function drawMic() {
    const b = $("[data-mic]"); if (!b) return;
    const st = voice.state, on = st === "listening";
    b.title = on ? "Stop listening" : st === "speaking" ? "Speaking…" : "Voice search";
    b.className = `shrink-0 p-2 rounded-full transition-all ${on ? "bg-red-500 text-white animate-pulse" : st === "speaking" ? "bg-accent text-accent-foreground animate-pulse" : "bg-white/20 text-primary-foreground hover:bg-white/30"}`;

  function drawTabs() {
    $("[data-tabs]").innerHTML = sections.map(x => {

  function listToShow() {

      const ids = new Set(onlyParcels().map(p => p.stopId)), pos = id => sections.findIndex(x => x.id === id);
      return all.filter(s => ids.has(s.id)).sort((a, b) => pos(a.sectionId) - pos(b.sectionId) || a.stopOrder - b.stopOrder);
    }
    const base = sectionStops(), q = S.query.trim();
    if (S.reorder || !q) return base;
    const P = pool(), r = exactFirst(searchStops(P, q).results, S.query);

  }
  const addBtn = (label, after) => `<button data-insert="${after}" class="w-full flex items-center justify-center gap-1.5 py-1 my-0.5 rounded-lg border border-dashed border-primary/25 text-primary/60 text-xs font-semibold hover:border-primary/60 hover:text-primary hover:bg-primary/5 transition-all disabled:opacity-40">${icon("plus", 12)}${label}</button>`;
  const parcelBadge = s => { const n = parcelCount(s.id); return n ? `<div class="mb-1"><span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-xs font-bold bg-yellow-400 text-yellow-950">📦 ${n} today</span></div>` : ""; };
  function drawList() {
    if (S.mode === "van" && !S.query.trim()) { $("[data-clear]").style.display = "none"; if (sortable) { sortable.destroy(); sortable = null; } return drawVan(); }
    const q = S.query.trim(), searching = q.length > 0 && !S.reorder && !S.parcelList, items = listToShow(), base = sectionStops(), P = pool();
    const tapMode = S.mode === "parcel" || (S.pendingParcel && S.pendingParcel.until > Date.now());
    $("[data-clear]").style.display = S.query ? "" : "none";
    $("[data-count]").textContent = S.parcelList ? `${items.length} houses with parcels today, in delivery order`
      : S.reorder ? `${base.length} stops — drag to reorder`
      : searching ? `${items.length} of ${P.length} stops ${S.mode === "delivery" ? "in this box" : "across route"} matching "${S.query}"`

          <button data-del="${s.id}" class="flex items-center justify-center w-8 shrink-0 rounded-xl bg-destructive/10 border border-destructive/30 text-destructive hover:bg-destructive/20 transition-colors disabled:opacity-50" aria-label="Delete stop">${icon("trash", 16)}</button>

      let lastSec = null;
      listEl.innerHTML = (S.pendingParcel && S.pendingParcel.until > Date.now() ? `<p class="text-sm font-semibold text-yellow-900 bg-yellow-100 border border-yellow-300 rounded-lg px-3 py-2">Tap the right house to log ${S.pendingParcel.count} parcel${S.pendingParcel.count > 1 ? "s" : ""}</p>` : "") +
        items.map(s => {
          let head = "";
          if (searching || S.parcelList) { const sec = sections.find(x => x.id === s.sectionId); if (sec && (!S.parcelList || sec.id !== lastSec)) head = `<p class="text-xs font-semibold text-primary/60 px-1 pt-1 pb-0.5">Box ${sec.boxNumber} · ${esc(sec.name)}</p>`; lastSec = sec?.id; }
          return `<div>${head}${parcelBadge(s)}${stopCardHTML(s, S.parcelList ? "" : S.query, canEdit || tapMode)}</div>`;
        }).join("");
      if (tapMode) $$(".stop-card [class*='text-[10px]']", listEl).forEach(e => (e.textContent = S.mode === "parcel" ? "tap to add a parcel" : "tap to log parcel"));

  function selectSection(id) {
    S.sectionId = id; S.query = ""; qEl.value = ""; S.riPick = null; S.parcelList = false; window.speechSynthesis?.cancel();
    $(`[data-section-id="${id}"]`)?.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
    drawHeader(); drawList();
  }

  /* ---- live RI "visual search" as you type ---- */
  let riTok = 0;
  async function riVisual() {
    const tok = ++riTok; S.riPick = null;
    const q = S.query.trim(); if (!q || RI_CFG.enabled === false) return;
    try { const hit = pickConfident(await ri.search(q), pool()); if (tok === riTok && hit) { S.riPick = hit; drawList(); } } catch {}
  }

  /* ---- actions ---- */
  async function onDragEnd() {
    const ids = $$("[data-row]", listEl).map(r => +r.dataset.row);
    ids.forEach((id, i) => { const s = all.find(x => x.id === id); if (s) s.stopOrder = i + 1; });
    drawList();
    const { error } = await sb.rpc("reorder_stops", { p_section_id: S.sectionId, p_ordered_ids: ids });
    if (error) { toast.error(OFF.isNetErr(error) ? "Reordering needs signal — try again when online" : "Reorder failed — refreshing"); viewRoute(routeId); }
  }
  async function insertAfter(after) {
    const { data, error } = await sb.rpc("insert_stop", { p_section_id: S.sectionId, p_after_order: after });
    if (error || !data) return toast.error(error && OFF.isNetErr(error) ? "Adding stops needs signal" : "Could not add stop");
    all.forEach(s => { if (s.sectionId === S.sectionId && s.stopOrder > after) s.stopOrder++; });
    const ns = toStop(data); all.push(ns); drawList();
    openEdit(ns, true);
  }
  async function deleteStop(id, silent) {
    const s = all.find(x => x.id === id); if (!s) return;
    if (!silent && !(await confirmDialog("Delete this stop?", `This action cannot be undone. Stop ${s.stopOrder} will be permanently removed from the route.`))) return;
    const { error } = await sb.rpc("delete_stop", { p_id: id });
    if (error) return toast.error(OFF.isNetErr(error) ? "Deleting needs signal" : "Delete failed: " + error.message);
    all = all.filter(x => x.id !== id);
    all.forEach(x => { if (x.sectionId === s.sectionId && x.stopOrder > s.stopOrder) x.stopOrder--; });
    ri.build(all); drawList();
  }
  function cacheStops() {
    try { const k = `rl-route-${routeId}`, c = JSON.parse(lsGet(k) || "null"); if (c) { c.stops = all.map(fromStop); localStorage.setItem(k, JSON.stringify(c)); } } catch {}
  }
  function openEdit(stop, isNew = false) {
    let saved = false;
    openEditModal({
      stop, section: sections.find(x => x.id === stop.sectionId) || curSection(), isNew,
      onSaved: ns => { saved = true; all = all.map(x => (x.id === ns.id ? ns : x)); ri.build(all); cacheStops(); drawList(); },
      onClose: () => { if (isNew && !saved) deleteStop(stop.id, true); }
    });
  }
  // Learn only real mishearings: if the tapped house already matched what was heard
  // (e.g. "McGinley" and there are 6 McGinleys), there's nothing to learn.
  const shouldLearn = (c, stop) => !!(c && c.transcript) && !(stopMatches(stop, c.transcript) && (c.matchResults || []).some(x => x.id === stop.id));
  function markCorrected(stop) {
    if (!S.lastEventId || stop.id === S.lastEventStopId) return;
    const id = S.lastEventId; S.lastEventId = null;
    sb.rpc("mark_search_corrected", { p_id: id, p_token: token, p_stop_id: stop.id, p_stop_name: stop.businessName || splitPipe(stop.residents)[0] || "" }).then(() => {}, () => {});
  }
  function onTap(stop) {
    if (S.mode === "parcel" || (S.pendingParcel && S.pendingParcel.until > Date.now())) {
      const pending = S.pendingParcel?.until > Date.now();
      const n = pending ? S.pendingParcel.count : 1;
      const c0 = S.lastCtx;
      if (pending) { markCorrected(stop); if (c0 && Date.now() - c0.timestamp <= 20000 && shouldLearn(c0, stop)) ri.recordCorrection(c0.transcript, stop.id).catch(() => {}); }
      S.pendingParcel = null;
      return logParcel(stop, n, "tap");
    }
    const c = S.lastCtx;
    if (c && Date.now() - c.timestamp <= 10000) {
      if (S.mode === "sorting") { if (S.lastLetter) moveLastLetter(stop); else logLetter(stop); }
      markCorrected(stop);
      if (shouldLearn(c, stop)) ri.recordCorrection(c.transcript, stop.id).catch(x => console.warn("[Learning] Failed to record correction:", x));
      S.lastCtx = null;
    }
    if (canEdit) openEdit(stop);
  }
  async function exportMappings() {
    const { data = [], error } = await sb.from("corrections").select("*").eq("route_id", routeId).order("confirmation_count", { ascending: false });
    if (error) return toast.error("Failed to export learned mappings");
    if (!data.length) return toast.info("No learned mappings to export");
    downloadFile(`learned-mappings-${route.name}-${new Date().toISOString().split("T")[0]}.json`, JSON.stringify({
      routeId, routeName: route.name, exportedAt: new Date().toISOString(), totalMappings: data.length,
      mappings: data.map(m => ({ originalTranscript: m.original_transcript, normalizedTranscript: m.normalized_transcript, stopId: m.stop_id, confirmationCount: m.confirmation_count, confidence: Math.min(0.5 + m.confirmation_count * 0.1, 0.85), firstConfirmedAt: m.first_confirmed_at, lastConfirmedAt: m.last_confirmed_at }))
    }, null, 2));
    toast.success(`Exported ${data.length} learned mappings`);
  }

  /* ---- wiring ---- */
  $("[data-tabs]").onclick = e => { const b = e.target.closest("[data-section-id]"); if (b) { S.reorder = false; selectSection(+b.dataset.sectionId); } };
  $("[data-modes]").onclick = e => {
    const b = e.target.closest("[data-mode]"); if (!b) return;
    S.mode = b.dataset.mode; S.query = ""; S.riPick = null; S.parcelList = false; S.pendingParcel = null; qEl.value = ""; window.speechSynthesis?.cancel();
    lsSet("rl-mode-" + routeId, S.mode);
    if (S.mode === "delivery" && sections[0]) S.sectionId = sections[0].id;
    drawHeader(); drawList(); window.scrollTo(0, 0);
    if (S.mode === "van" && vanRun().length) speak(vanCallout(vanNext(), "First stop"));
  };
  $("[data-plist]").onclick = () => { S.parcelList = !S.parcelList; S.query = ""; qEl.value = ""; drawHeader(); drawList(); window.scrollTo(0, 0); };
  qEl.oninput = () => { S.query = qEl.value; S.riPick = null; S.parcelList = false; drawList(); riVisual(); };
  $("[data-clear]").onclick = () => { S.query = ""; qEl.value = ""; S.riPick = null; window.speechSynthesis?.cancel(); drawList(); };
  $("[data-mic]").onpointerdown = () => {
    voice.prime();
    if (voice.state === "listening" || voice.state === "speaking") { voice.toggle(); S.query = ""; qEl.value = ""; window.speechSynthesis?.cancel(); drawList(); }
    else voice.toggle();
  };
  const unlock = () => {
    try {
      window.speechSynthesis.cancel(); window.speechSynthesis.resume?.();
      const u = new SpeechSynthesisUtterance("Sound on"); const v = pickVoice(); if (v) { u.voice = v; u.lang = v.lang; } else u.lang = "en-GB";
      u.onend = () => toast.success("🔊 Sound is working"); u.onerror = ev => toast.error("Sound blocked (" + (ev.error || "error") + ") — check the silent switch and volume");
      window.speechSynthesis.speak(u);
    } catch (e) { toast.error("This browser can't speak"); }
  };
  $("[data-audio]").onclick = unlock;
  const ftb = $("[data-ft]"); if (ftb) ftb.onclick = () => { S.fieldTest = !S.fieldTest; lsSet(FT_KEY, String(S.fieldTest)); toast.success(S.fieldTest ? "Field test logging enabled" : "Field test logging disabled"); drawHeader(); };
  const exb = $("[data-export]"); if (exb) exb.onclick = exportMappings;
  const ro = $("[data-reorder]"); if (ro) ro.onclick = () => { S.reorder = !S.reorder; S.query = ""; qEl.value = ""; S.parcelList = false; drawHeader(); drawList(); };
  const vanClicks = e => {
    const v = e.target.closest("[data-van]");
    if (v) { const nx = vanNext(); if (!nx) return; if (v.dataset.van === "pin") return pinStop(nx); if (v.dataset.van === "say") return speak(vanCallout(nx)); return markStop(nx, v.dataset.van); }
    if (e.target.closest("[data-vanall]")) { S.vanAll = true; drawList(); speak(vanCallout(vanNext(), "First stop")); return true; }
    if (e.target.closest("[data-vantoday]")) { S.vanAll = false; drawList(); return true; }
    const un = e.target.closest("[data-unskip]"); if (un) { markStop(all.find(x => x.id === +un.dataset.unskip), null); return true; }
  };
  $("[data-foot]").addEventListener("click", vanClicks);
  listEl.addEventListener("click", e => {
    if (S.mode === "van" && !S.query.trim()) return vanClicks(e);
    const ins = e.target.closest("[data-insert]"); if (ins) { ins.disabled = true; return insertAfter(+ins.dataset.insert); }
    const del = e.target.closest("[data-del]"); if (del) return deleteStop(+del.dataset.del);
    if (e.target.closest("[data-clearq]")) { S.query = ""; qEl.value = ""; return drawList(); }
    const card = e.target.closest("[data-stop-id]");
    if (card && !S.reorder) { const s = all.find(x => x.id === +card.dataset.stopId); if (s) onTap(s); }
  });
  listEl.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-stop-id][role=button]")) e.target.click(); });

  if (location.search.includes("debug")) window.rlSay = onTranscript; // test voice flow: rlSay('rita mcginley', true)
  drawHeader(); drawList();
  cleanup = () => { voice.destroy(); window.speechSynthesis?.cancel(); if (sortable) sortable.destroy(); };
}

/* ---------- Map view (port of MapView.tsx) ---------- */
const MAP_COLOURS = ["#1a3a5c", "#b8860b", "#1e6b3c", "#8b1a1a", "#2e4a7a", "#7a4a1a", "#1a5c5c", "#5c1a5c", "#3c5c1a", "#5c3c1a"];
let mapsPromise = null;
function loadMaps() {
  if (window.google?.maps) return Promise.resolve();
  if (!CONFIG.GOOGLE_MAPS_KEY) return Promise.reject(new Error("nokey"));
  return mapsPromise || (mapsPromise = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(CONFIG.GOOGLE_MAPS_KEY)}&v=weekly`;
    s.async = true; s.onload = res; s.onerror = () => { mapsPromise = null; rej(new Error("Google Maps script failed to load")); };
    document.head.appendChild(s);
  }));
}
async function viewMap(routeId) {
  mount(spinner());
  const [secRows, stopRows] = await Promise.all([fetchAll("sections", { route_id: routeId }, ["position"]), fetchAll("stops", { route_id: routeId }, ["section_id", "stop_order"])]);
  const a = secRows.map(toSection), y = stopRows.map(toStop), geo = y.filter(s => s.lat && s.lng);
  mount(`<div class="min-h-screen bg-background flex flex-col">
    <header class="bg-primary text-primary-foreground px-3 py-2.5 flex items-center gap-3 sticky top-0 z-30 shadow-md no-print">
      <a href="#/route/${routeId}" class="p-1.5 rounded-full hover:bg-white/10 transition-colors">${icon("arrowLeft", 18)}</a>
      <div><h1 class="text-base font-bold">Route Map</h1><p class="text-xs opacity-75">${a.length} sections · ${geo.length} geocoded stops</p></div>
    </header>
    <div class="flex gap-2 overflow-x-auto scrollbar-hide px-3 py-2 bg-white border-b no-print">
      ${a.map((S, E) => `<div class="flex items-center gap-1 shrink-0"><span class="w-3 h-3 rounded-full inline-block" style="background-color:${MAP_COLOURS[E % 10]}"></span><span class="text-xs text-muted-foreground whitespace-nowrap">${S.boxNumber}. ${esc(S.name)}</span></div>`).join("")}
    </div>
    <div data-map class="flex-1" style="min-height:calc(100vh - 120px)"></div></div>`);
  const box = $("[data-map]");
  const msg = t => (box.outerHTML = `<div class="flex-1 flex items-center justify-center px-4"><p class="text-sm text-muted-foreground text-center">${t}</p></div>`);
  try { await loadMaps(); } catch (e) { return msg(e.message === "nokey" ? "Map needs a Google Maps key — add GOOGLE_MAPS_KEY in the CONFIG block." : "Map failed to load. Please check your connection."); }
  const G = window.google, map = new G.maps.Map(box, { center: { lat: 54.95, lng: -8.15 }, zoom: 12, mapTypeId: "roadmap", mapTypeControl: true, mapTypeControlOptions: { mapTypeIds: ["roadmap", "satellite", "hybrid"] }, streetViewControl: true, fullscreenControl: false });
  const bounds = new G.maps.LatLngBounds(); let any = false;
  geo.forEach(R => {
    const H = parseFloat(R.lat), L = parseFloat(R.lng); if (isNaN(H) || isNaN(L)) return;
    const k = MAP_COLOURS[a.findIndex(_ => _.id === R.sectionId) % 10] ?? "#1a3a5c";
    const mk = new G.maps.Marker({ position: { lat: H, lng: L }, map, title: `#${R.stopOrder} — ${splitPipe(R.residents)[0] ?? ""}`, label: { text: String(R.stopOrder), color: "#fff", fontSize: "10px", fontWeight: "bold" }, icon: { path: G.maps.SymbolPath.CIRCLE, fillColor: k, fillOpacity: 1, strokeColor: "#fff", strokeWeight: 1.5, scale: 10 } });
    const iw = new G.maps.InfoWindow({ content: `<div style="font-family:Inter,sans-serif;max-width:220px;font-size:13px"><strong>#${R.stopOrder} ${esc(R.side ?? "")}</strong><br/>${splitPipe(R.residents).map(esc).join("<br/>")}${R.notes ? `<p style="margin:4px 0 0;color:#666;font-size:11px">${esc(R.notes)}</p>` : ""}${R.eircode ? `<p style="margin:2px 0 0;font-size:11px;color:#888">${esc(R.eircode)}</p>` : ""}<a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${H},${L}" target="_blank" style="display:inline-block;margin-top:6px;font-size:11px;color:#1a3a5c">Street View ↗</a></div>` });
    mk.addListener("click", () => iw.open(map, mk)); bounds.extend({ lat: H, lng: L }); any = true;
  });
  if (any) map.fitBounds(bounds, 40);
}

/* ---------- Print view (port of PrintView.tsx) ---------- */
async function viewPrint(routeId) {
  mount(spinner());
  const [{ data: route }, secRows, stopRows] = await Promise.all([sb.from("routes").select("*").eq("id", routeId).maybeSingle(), fetchAll("sections", { route_id: routeId }, ["position"]), fetchAll("stops", { route_id: routeId }, ["section_id", "stop_order"])]);
  const a = secRows.map(toSection), o = stopRows.map(toStop), l = c => o.filter(u => u.sectionId === c).sort((u, f) => u.stopOrder - f.stopOrder);
  const side = s => { if (!s) return ""; const r = s.trim().toLowerCase(), L = r === "left" || r === "l", R = r === "right" || r === "r"; return `<span class="inline-block px-1 rounded text-xs font-bold ${L ? "bg-blue-100 text-blue-800" : "bg-emerald-100 text-emerald-800"}">${L ? "L" : R ? "R" : esc(s)}</span>`; };
  const row = t => { const r = splitPipe(t.residents), al = splitPipe(t.aliases); return `<tr class="border-b border-gray-200 text-xs">
    <td class="py-1 pr-2 text-right text-gray-500 w-6">${t.stopOrder}</td><td class="py-1 pr-2">${side(t.side)}</td>
    <td class="py-1 pr-2"><div class="font-semibold">${esc(t.businessName && t.propertyType === "Business" ? t.businessName : r[0] ?? "")}</div>${(t.businessName && t.propertyType === "Business" ? r : r.slice(1)).map(x => `<div class="text-gray-500">${esc(x)}</div>`).join("")}${al.length ? `<div class="text-gray-400 italic text-xs">${esc(al.join(", "))}</div>` : ""}</td>
    <td class="py-1 pr-2 text-gray-500">${esc(t.road)}</td><td class="py-1 pr-2 font-mono text-gray-500">${esc(t.eircode)}</td>
    <td class="py-1 text-gray-600">${t.hasDog ? `<span class="text-red-600 font-bold mr-1">DOG</span>` : ""}${t.safePlace ? `<span class="font-semibold">Drop-off: ${esc(t.safePlace)}.</span> ` : ""}${esc(t.notes)}</td></tr>`; };
  mount(`<div class="min-h-screen bg-white">
    <div class="no-print flex items-center gap-3 px-4 py-3 bg-primary text-primary-foreground sticky top-0 z-10">
      <a href="#/route/${routeId}" class="p-1.5 rounded-full hover:bg-white/10">${icon("arrowLeft", 18)}</a>
      <span class="flex-1 font-semibold text-sm">Print View</span>
      <button onclick="window.print()" class="flex items-center gap-1.5 bg-accent text-accent-foreground px-3 py-1.5 rounded-full text-sm font-semibold">${icon("printer", 14)} Print</button>
    </div>
    <div class="p-6 max-w-4xl mx-auto">
      <div class="mb-6 border-b-2 border-primary pb-4"><h1 class="text-2xl font-bold text-primary">${esc(route?.name ?? "Route")}</h1><p class="text-sm text-muted-foreground mt-1">${a.length} sections · ${o.length} stops</p></div>
      <div class="mb-8"><h2 class="text-sm font-bold uppercase tracking-wide text-muted-foreground mb-2">Section Index</h2>
        <div class="grid grid-cols-2 gap-x-8 gap-y-1">${a.map(c => `<div class="flex items-baseline gap-2 text-sm"><span class="font-bold text-primary w-6 text-right shrink-0">${c.boxNumber}</span><span class="text-foreground">${esc(c.name)}</span><span class="text-muted-foreground text-xs ml-auto">${l(c.id).length} stops</span></div>`).join("")}</div></div>
      ${a.map(c => { const u = l(c.id); return `<div class="print-section mb-8"><h2 class="text-base font-bold text-primary mb-2 border-b border-primary pb-1">Box ${c.boxNumber} — ${esc(c.name)}<span class="text-xs font-normal text-muted-foreground ml-2">(${u.length} stops)</span></h2>
        <table class="w-full text-xs border-collapse"><thead><tr class="border-b-2 border-gray-300 text-left text-gray-500 uppercase tracking-wide"><th class="py-1 pr-2 w-6">#</th><th class="py-1 pr-2 w-6">Side</th><th class="py-1 pr-2">Residents / Aliases</th><th class="py-1 pr-2">Road</th><th class="py-1 pr-2">Eircode</th><th class="py-1">Notes</th></tr></thead>
        <tbody>${u.map(row).join("")}</tbody></table></div>`; }).join("")}
    </div></div>`);
}

/* =====================================================================
   ROUTER
   ===================================================================== */
async function loadProfile() {
  let session = null;
  try { ({ data: { session } } = await sb.auth.getSession()); } catch {}
  state.user = session?.user ?? null;
  state.profile = null;
  if (state.user) {
    lsSet("rl-user", JSON.stringify({ id: state.user.id, email: state.user.email }));
    try { const { data } = await sb.from("profiles").select("*").eq("id", state.user.id).maybeSingle(); state.profile = data; if (data) lsSet("rl-profile", JSON.stringify(data)); }
    catch { try { state.profile = JSON.parse(lsGet("rl-profile") || "null"); } catch {} }
  } else if (!navigator.onLine && lsGet("rl-user")) {
    // offline with an expired session: keep working from the saved route
    try { state.user = JSON.parse(lsGet("rl-user")); state.profile = JSON.parse(lsGet("rl-profile") || "null"); state.offlineUser = true; } catch {}
  }
}
async function router() {
  if (!sb) return viewSetup();
  const h = location.hash.replace(/^#/, "") || "/";
  const parts = h.split("/").filter(Boolean);
  const qsRelief = new URLSearchParams(location.search).get("relief");   // ?relief=TOKEN survives apps that drop the #part
  if (qsRelief) return viewShare(qsRelief);
  if (parts[0] === "share" && parts[1]) return viewShare(parts[1]);
  if (parts[0] === "newpass") return viewLogin("newpass");
  await loadProfile();
  if (!state.user) {
    if (parts[0] === "signup") return viewLogin("signup");
    if (parts[0] === "reset") return viewLogin("reset");
    return viewLogin("signin");
  }
  if (parts[0] === "route" && parts[1]) {
    const id = +parts[1];
    if (parts[2] === "map") return viewMap(id);
    if (parts[2] === "print") return viewPrint(id);
    return viewRoute(id);
  }
  if (parts[0] === "routes") return navigator.onLine || !lsGet("rl-last-route") ? viewRoutes() : viewRoute(+lsGet("rl-last-route"));
  location.replace("#/routes");
}
window.addEventListener("hashchange", router);
if (sb) sb.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") location.hash = "#/newpass"; });
if (sb) sb.auth.onAuthStateChange(ev => { if (ev === "SIGNED_OUT") ["rl-user", "rl-profile"].forEach(k => { try { localStorage.removeItem(k); } catch {} }); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(e => console.warn("[SW]", e));
router();

</script>
